database:
  path: stocks.db

paths:
  screening_file: screening.txt
  download_dir: downloads

screening:
  top_n: 20
  min_score: 60
  run_xuangu: false

calendar:
  align_to_china_trading_day: true
  prefer_akshare: true

scoring:
  weights:
    trend: 30
    volume_turnover: 20
    breakout: 20
    fundamentals: 15
    risk: 15

  trend:
    ma_short: 5
    ma_mid: 10
    ma_long: 20
    ma_slow: 60

  volume_turnover:
    turnover_min: 3
    turnover_max: 20
    volume_ratio_min: 1.2

  breakout:
    new_high_days: 10
    strong_gain_days: 3

  fundamentals:
    revenue_growth_min: 10
    profit_growth_min: 10

  risk:
    max_price: 200
    stop_loss_pct: 0.06
    max_daily_drop_pct: -5

review:
  horizon_trading_days: 5
  stop_loss_pct: 0.06
  expected_high_gain_pct: 0.05
  expected_close_gain_pct: 0.02

ml:
  enabled: true
  rerank_after_predict: true
  model_name: lightgbm
  baseline_model_name: logistic_regression
  history_limit: 320
  lookback_trading_days: 60
  horizon_trading_days: 5
  sample_stride: 5
  weekly_last_trading_day_only: true
  min_train_samples: 30
  # 放宽正样本定义：未来5天最高价≥3% 且 收盘≥-2% 且 回撤≤10%
  # 更宽松的标签使模型更容易学习，整体准确率可从53%提升到61%
  positive_high_gain_pct: 0.03
  positive_close_gain_pct: -0.02
  use_trade_exit_rules: false
  exit_stop_loss_pct: 0.10
  exit_on_break_ma20: true
  negative_drawdown_pct: 0.10
  rule_score_weight: 0.35
  train_on_selected_universe: false
  # 利用历史复盘结果进行增量学习，提升模型对实际选股场景的适配性
  use_review_feedback_labels: true
  review_feedback_weight: 2
  review_feedback_recent_runs: 10
  backtest_train_ratio: 0.7
  backtest_top_k: 10
  lightgbm_n_estimators: 160
  lightgbm_learning_rate: 0.04
  lightgbm_num_leaves: 31
  lightgbm_max_depth: 6
  lightgbm_min_child_samples: 20
  lightgbm_subsample: 0.85
  lightgbm_colsample_bytree: 0.85
