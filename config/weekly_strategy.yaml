database:
  path: stocks.db

paths:
  screening_file: screening.txt
  download_dir: downloads

screening:
  top_n: 50
  min_score: 60
  run_xuangu: false

calendar:
  align_to_china_trading_day: true
  prefer_akshare: true

scoring:
  weights:
    trend: 30
    volume_turnover: 20
    breakout: 20
    fundamentals: 15
    risk: 15

  trend:
    ma_short: 5
    ma_mid: 10
    ma_long: 20
    ma_slow: 60

  volume_turnover:
    turnover_min: 3
    turnover_max: 20
    volume_ratio_min: 1.2

  breakout:
    new_high_days: 10
    strong_gain_days: 3

  fundamentals:
    revenue_growth_min: 10
    profit_growth_min: 10

  risk:
    max_price: 200
    stop_loss_pct: 0.06
    max_daily_drop_pct: -5

review:
  horizon_trading_days: 5
  stop_loss_pct: 0.06
  expected_high_gain_pct: 0.05
  expected_close_gain_pct: 0.02

ml:
  enabled: false
  model_name: lightgbm
  baseline_model_name: logistic_regression
  history_limit: 320
  lookback_trading_days: 60
  horizon_trading_days: 5
  sample_stride: 5
  weekly_last_trading_day_only: true
  min_train_samples: 30
  positive_high_gain_pct: 0.05
  positive_close_gain_pct: 0.0
  use_trade_exit_rules: true
  exit_stop_loss_pct: 0.10
  exit_on_break_ma20: true
  negative_drawdown_pct: 0.06
  rule_score_weight: 0.35
  train_on_selected_universe: false
  use_review_feedback_labels: false
  review_feedback_weight: 1
  review_feedback_recent_runs: 0
  backtest_train_ratio: 0.7
  backtest_top_k: 10
  lightgbm_n_estimators: 160
  lightgbm_learning_rate: 0.04
  lightgbm_num_leaves: 15
  lightgbm_max_depth: 4
  lightgbm_min_child_samples: 20
  lightgbm_subsample: 0.85
  lightgbm_colsample_bytree: 0.85
