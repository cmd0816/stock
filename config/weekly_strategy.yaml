database:
  path: stocks.db

paths:
  screening_file: screening.txt
  download_dir: downloads

screening:
  top_n: 20
  min_score: 60
  run_xuangu: false

calendar:
  align_to_china_trading_day: true
  prefer_akshare: true

scoring:
  weights:
    trend: 30
    volume_turnover: 20
    breakout: 20
    fundamentals: 15
    risk: 15

  trend:
    ma_short: 5
    ma_mid: 10
    ma_long: 20
    ma_slow: 60

  volume_turnover:
    turnover_min: 3
    turnover_max: 20
    volume_ratio_min: 1.2

  breakout:
    new_high_days: 10
    strong_gain_days: 3

  fundamentals:
    revenue_growth_min: 10
    profit_growth_min: 10

  risk:
    max_price: 200
    stop_loss_pct: 0.06
    max_daily_drop_pct: -5
    max_atr_pct: 8
    max_5d_gain_pct: 15

review:
  horizon_trading_days: 5
  stop_loss_pct: 0.06
  expected_high_gain_pct: 0.05
  expected_close_gain_pct: 0.02
  # 复盘前先补齐“被复盘 run 的所有入选股票”日 K，不再限制 Top N。
  download_before_review: true
  download_days: 365
  download_min_existing_days: 200
  download_adjust: qfq
  download_source: auto
  download_fail_on_error: false

ml:
  enabled: true
  # Keep ML in shadow mode until realized reviews beat rule ranking.
  rerank_after_predict: false
  model_name: lightgbm
  baseline_model_name: logistic_regression
  history_limit: 320
  lookback_trading_days: 60
  horizon_trading_days: 5
  sample_stride: 5
  weekly_last_trading_day_only: true
  min_train_samples: 30
  # 正样本定义对齐复盘：未来5天最高价≥5% 或 收盘≥2%，且回撤不触发6%止损
  positive_high_gain_pct: 0.05
  positive_close_gain_pct: 0.02
  positive_target_logic: any
  use_trade_exit_rules: true
  # Keep training labels aligned with the live review stop.
  exit_stop_loss_pct: 0.06
  exit_on_break_ma20: false
  negative_drawdown_pct: 0.06
  rule_score_weight: 0.25
  # 将入选股规则分转为横截面百分位后再与ML概率混合，避免95分附近的小数差异失去作用
  normalize_rule_score_for_blend: true
  train_on_selected_universe: false
  # 利用历史复盘结果进行增量学习，提升模型对实际选股场景的适配性
  use_review_feedback_labels: true
  review_feedback_weight: 2
  review_feedback_recent_runs: 10
  backtest_train_ratio: 0.7
  backtest_top_k: 10
  lightgbm_n_estimators: 160
  lightgbm_learning_rate: 0.04
  lightgbm_num_leaves: 31
  lightgbm_max_depth: 6
  lightgbm_min_child_samples: 20
  lightgbm_subsample: 0.85
  lightgbm_colsample_bytree: 0.85
